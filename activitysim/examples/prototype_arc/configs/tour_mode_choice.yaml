LOGIT_TYPE: NL
#LOGIT_TYPE: MNL

NESTS:
  name: root
  coefficient: 1.00
  alternatives:
      - name: AUTO
        coefficient: 0.60
        alternatives:
            - name: DRIVEALONE
              coefficient: 0.4
              alternatives:
              - DRIVEALONEFREE
              - DRIVEALONEPAY
            - name: SHAREDRIDE2
              coefficient: 0.4
              alternatives:
              - SHARED2FREE
              - SHARED2PAY
            - name: SHAREDRIDE3
              coefficient: 0.4
              alternatives:
              - SHARED3FREE
              - SHARED3PAY
      - name: NONMOTORIZED
        coefficient: 0.6
        alternatives:
        - WALK
        - BIKE
      - name: TRANSIT
        coefficient:  0.6
        alternatives:
            - name: WALKACCESS
              coefficient: 0.4
              alternatives:
              - WALK_ALLTRN
              - WALK_PRMTRN
            - name: PNRACCESS
              coefficient: 0.4
              alternatives:
              - PNR_ALLTRN
              - PNR_PRMTRN
            - name: KNRACCESS
              coefficient: 0.4
              alternatives:
              - KNR_ALLTRN
              - KNR_PRMTRN
      - name: SCHOOL
        coefficient: 1.0
        alternatives:
        - SCHOOL_BUS

SPEC: tour_mode_choice.csv
COEFFICIENTS: tour_mode_choice_coeffs.csv
COEFFICIENT_TEMPLATE: tour_mode_choice_coeffs_template.csv

CONSTANTS:
    #valueOfTime: 8.00
    costPerMile: 17.29
    costShareSr2: 1.75
    costShareSr3: 2.50
    waitThresh: 10.00
    walkThresh: 0.6667
    shortWalk: 0.333
    longWalk: 0.667
    walkSpeed: 3.00
    bikeThresh: 6.00
    bikeSpeed: 12.00
    maxCbdAreaTypeThresh: 2
    indivTour: 1.00000
    upperEA: 12
    upperAM: 22
    upperMD: 32
    upperPM: 40


# so far, we can use the same spec as for non-joint tours
preprocessor:
  SPEC: tour_mode_choice_annotate_choosers_preprocessor
  DF: choosers
  TABLES:
    - land_use
    - tours

nontour_preprocessor:
  SPEC: tour_mode_choice_annotate_choosers_preprocessor
  DF: choosers
  TABLES:
    - land_use

